<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TP08 ToDo Frontend</title>
    <style>body{font-family:Arial;margin:2rem}#todos{margin-top:1rem}</style>
  </head>
  <body>
    <h1>ToDo Frontend</h1>
    <input id="text" placeholder="Nouvelle todo" />
    <button id="add">Ajouter</button>
    <div id="todos"></div>

    <script>
      const statusEl = document.createElement('div');
      statusEl.id = 'status';
      statusEl.style.marginTop = '1rem';
      document.body.insertBefore(statusEl, document.getElementById('todos'));

      async function api(path, opts){
        const res = await fetch('/api'+path, opts);
        if(!res.ok) {
          const txt = await res.text().catch(()=>null);
          throw new Error('HTTP '+res.status+': '+ (txt || res.statusText));
        }
        const ctype = res.headers.get('content-type') || '';
        if(ctype.includes('application/json')) return await res.json();
        return null;
      }

      async function refresh(){
        try{
          const list = await api('/todos');
          document.getElementById('todos').innerHTML = list.map(t=>'<div>'+t.id+': '+t.text+'</div>').join('');
          statusEl.textContent = '';
        }catch(e){
          statusEl.textContent = 'Erreur de récupération des todos: '+e.message;
        }
      }

      document.getElementById('add').addEventListener('click', async ()=>{
        const text = document.getElementById('text').value;
        if(!text) return;
        try{
          const result = await api('/todos', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
          document.getElementById('text').value='';
          statusEl.textContent = 'Todo ajoutée (id='+ (result && result.id ? result.id : '?') +')';
          refresh();
        }catch(e){
          statusEl.textContent = 'Erreur ajout todo: '+e.message;
        }
      });

      // Initial load
      refresh();
    </script>
  </body>
</html>
